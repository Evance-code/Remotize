    <style>
        :root {
            --primary-dark: #0b0b1a;
            --primary-darker: #050510;
            --primary-green: #00c97a;
            --green-hover: #00b36b;
            --text-dark: #1a1a2e;
            --text-soft: #4a4a6a;
            --bg-light: #f8fafd;
            --card-bg: #ffffff;
            --border-light: rgba(0,0,0,0.03);
            --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --shadow-hover: 0 25px 50px -12px rgba(0,0,0,0.15);
            --radius-card: 28px;
            --radius-btn: 40px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Subtle animated background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
              radial-gradient(circle at 20% 30%, rgba(0,201,122,0.03) 0%, transparent 30%),
              radial-gradient(circle at 80% 70%, rgba(102,126,234,0.03) 0%, transparent 30%);
            pointer-events: none;
            z-index: -1;
        }

        /* Modern Sticky Header with glass effect */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 26, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo img {
            height: 40px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0,201,122,0.3));
        }

        .logo span {
            background: linear-gradient(to right, #fff, #d4d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        nav {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 0;
            transition: color var(--transition);
            position: relative;
            font-size: 1rem;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: var(--primary-green);
            transition: width var(--transition);
        }

        nav a:hover::after,
        nav a:focus::after,
        nav a[aria-current="page"]::after {
            width: 100%;
        }

        nav a:hover,
        nav a:focus,
        nav a[aria-current="page"] {
            color: white;
            outline: none;
        }

        /* Main content */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }

        /* Hero Section with Slideshow */
        .hero {
            position: relative;
            color: white;
            text-align: center;
            padding: 4rem 1.5rem;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 60px -15px rgba(0,201,122,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .hero-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-slideshow .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .hero-slideshow .slide.active {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11,11,26,0.85), rgba(22,33,62,0.85));
            z-index: 2;
        }

        .hero-pulse {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(0,201,122,0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }

        .hero-content {
            position: relative;
            z-index: 4;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #d4d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-slideshow .slide {
                transition: none;
            }
            .hero-pulse {
                animation: none;
            }
        }

        /* Contact Form Section */
        .contact-section {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            border: 1px solid var(--border-light);
            max-width: 800px;
            margin: 0 auto 3rem;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .contact-section:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .contact-section h2 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-dark), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .contact-section p {
            text-align: center;
            color: var(--text-soft);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        /* Email display */
        .email-info {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(0,201,122,0.05);
            border-radius: 60px;
            border: 1px dashed var(--primary-green);
        }

        .email-info a {
            color: var(--primary-green);
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .email-info a:hover {
            text-decoration: underline;
        }

        .email-info .copy-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            margin-left: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .email-info .copy-btn:hover {
            background: var(--green-hover);
        }

        /* Google Form iframe */
        .form-container {
            width: 100%;
            overflow: hidden;
            border-radius: 20px;
        }

        .form-container iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }

        /* Footer */
        footer {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary-darker));
            color: #ccc;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer a {
            color: #aaa;
            text-decoration: none;
            margin: 0 0.5rem;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--primary-green);
        }

        .footer-email {
            margin: 0.5rem 0;
        }

        .footer-email a {
            color: var(--primary-green);
            font-weight: 500;
        }

        .social-links {
            margin-top: 1rem;
        }

        .social-links a {
            font-size: 1.4rem;
            margin: 0 0.75rem;
            color: #aaa;
            transition: color 0.2s, transform 0.2s;
            display: inline-block;
        }

        .social-links a:hover {
            color: var(--primary-green);
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: center;
            }
            .hero h1 { font-size: 2.2rem; }
            .contact-section { padding: 1.5rem; }
        }
    </style>
</head>

<!-- Slideshow script -->
<script>
(function() {
    const slides = document.querySelectorAll('.hero-slideshow .slide');
    if (slides.length) {
        let currentSlide = 0;
        slides[currentSlide].classList.add('active');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);
    }
})();

// Copy email to clipboard
function copyEmail() {
    const email = "a@remotize.ink";
    navigator.clipboard.writeText(email).then(() => {
        alert("Email copied to clipboard!");
    }).catch(err => {
        console.error("Failed to copy: ", err);
    });
}
</script>
